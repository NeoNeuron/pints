<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirming — PINTS</title>
<meta name="description" content="Finishing an email confirmation or a password reset for your PINTS account.">
<!-- Not indexable: every useful visit carries a one-time code in the query string. -->
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <h1 id="head">Just a moment</h1>

  <div id="msg" class="msg" role="status" aria-live="polite">Checking your link…</div>

  <!-- Only resetPassword uses this; the other modes never reveal it. -->
  <form id="reset-form" novalidate hidden>
    <label for="password">New password
      <span class="hint">At least 6 characters.</span>
    </label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>

    <label for="confirm">Repeat it</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>

    <div class="actions">
      <button id="save" type="submit">Set the password</button>
    </div>
  </form>

  <p class="actions" id="onward" hidden></p>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/page-auth-action.js"></script>
</body>
</html>
