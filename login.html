<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — PINTS</title>
<meta name="description" content="Sign in or create an account to register for PINTS.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <h1>Sign in</h1>
  <p class="prose muted">You need an account to register for PINTS and to submit a
    poster abstract. <a id="to-register" href="register.html">Create one</a> if you
    have not already — it is free.</p>

  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <form id="auth-form" novalidate>
    <label for="email">Email
      <span class="hint">Use your institutional address if you have one.</span>
    </label>
    <input id="email" name="email" type="email" autocomplete="email" required>

    <label for="password">Password
      <span class="hint">At least 6 characters.</span>
    </label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <div class="checkline">
      <input id="remember" type="checkbox" checked>
      <label for="remember">Remember me on this device</label>
    </div>

    <div class="actions">
      <button id="signin" type="submit">Sign in</button>
      <a class="button secondary" id="register-link" href="register.html">Create an account</a>
      <button id="reset" type="button" class="secondary">Forgot password</button>
    </div>
  </form>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/page-login.js"></script>
</body>
</html>
