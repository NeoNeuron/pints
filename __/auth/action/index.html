<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirming — PINTS</title>
<meta name="robots" content="noindex">
<!--
  Firebase's reserved action-handler path, served by us.

  Applying a custom email domain moves the action links in every auth mail onto
  pints.fr but does NOT change their path: they arrive as
  https://pints.fr/__/auth/action?mode=…&oobCode=…  On a Firebase Hosting site
  that path is served by Firebase itself. pints.fr is GitHub Pages, so nothing
  answers it unless this file does.

  The obvious alternative — pointing the template's "custom action URL" straight
  at /auth-action.html — is not available: that console field is validated
  against Firebase Hosting, and this project has no Hosting site (web.app returns
  "Site Not Found"). Setting it fails with "an error occurs in updating the
  action URL". Serving the reserved path needs no console setting at all.

  This is a shim, deliberately. The handler itself lives in ONE place,
  /auth-action.html; this file only translates Firebase's fixed path to it. Do
  not grow logic here — a second copy of the redemption code is a second thing
  to get wrong, and this one is invisible until somebody cannot verify.

  It survives only because .nojekyll is in the repository root: without it,
  GitHub Pages hands the site to Jekyll, which drops underscore-prefixed
  directories and takes password reset down with them.
-->
<script>
  // replace(), not assign(): the one-time code must not sit in history where a
  // Back press re-runs a request that can no longer succeed.
  location.replace("/auth-action.html" + location.search + location.hash);
</script>
</head>
<body>
<noscript><p>Open <a href="/auth-action.html">this page</a> to finish confirming.</p></noscript>
</body>
</html>
