<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abstracts — PINTS</title>
<meta name="description" content="Accepted talk and poster abstracts for PINTS.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <h1>Abstracts</h1>
  <div class="prose" data-markdown="content/poster-guidelines.md"></div>
  <p>
    <label for="q">Search
      <span class="hint">Matches titles, authors, affiliations, and abstract text.</span>
    </label>
    <input id="q" type="text" autocomplete="off">
  </p>
  <p id="count" class="muted"></p>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <div id="list"></div>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/page-abstracts.js"></script>
</body>
</html>
