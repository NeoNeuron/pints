<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit an abstract — PINTS</title>
<meta name="description" content="Submit a poster abstract for PINTS. No account needed — one is created for you.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <h1>Submit an abstract</h1>
  <p class="prose muted" id="intro">One abstract per person. Every abstract is
    presented as a poster, and every poster is considered for a talk unless you
    opt out.</p>

  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <div id="welcome" class="panel" hidden></div>
  <div id="form-host"></div>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/page-submit.js"></script>
</body>
</html>
