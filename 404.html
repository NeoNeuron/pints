<!doctype html>

<title>Page not found — PINTS</title>

<!--
  This page is deliberately self-contained: inline styles, no module imports,
  no shared header injection.

  GitHub Pages serves 404.html from the REQUESTED url's path, not from the site
  root. A visitor hitting /typo gets this file rendered at /typo/, where a
  relative "css/styles.css" resolves to /typo/css/styles.css and 404s — the page
  would load unstyled with no navigation. This is the one file in the repository
  that cannot use relative asset paths.

  The <base> tag below is the only thing to change if the site moves: it must
  match the path the site is served from. Currently pints-fr/pints-fr.github.io
  on GitHub Pages, served at the root — hence "/". It was "/pints/" while the
  site lived at https://neoneuron.github.io/pints/. If it ever moves back to a
  repo-name subpath, this must become "/<repo-name>/".
-->
<base href="/">
<style>
  :root { --ink:#1a1a1a; --muted:#5c5c5c; --line:#dcdcdc; --bg-soft:#f6f6f4; --accent:#7b1e3a; }
  body { margin:0; font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); }
  .wrap { max-width:62rem; margin:0 auto; padding:0 1.25rem; }
  header { border-bottom:1px solid var(--line); background:var(--bg-soft); }
  header .wrap { padding-block:1rem; }
  .brand { font-weight:700; font-size:1.35rem; color:var(--ink); text-decoration:none; }
  .brand small { display:block; font-weight:400; font-size:.78rem; color:var(--muted); }
  main { padding-block:3rem; max-width:68ch; }
  h1 { line-height:1.2; margin:0 0 1rem; }
  a { color:var(--accent); }
  ul { padding-left:1.2rem; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="index.html">PINTS<small>Paris Île-de-France Neuroscience, Theory, and Systems</small></a>
  </div>
</header>
<main class="wrap">
